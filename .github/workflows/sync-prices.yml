
name: Sync Match Attax Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Sync estimated prices from private Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import math
          import time
          from datetime import datetime, timezone, timedelta
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          SHEET_ID = "1nDSwSESkuvCb2FUYPdMovynhv5n9tWxN8GkfghuBm_g"
          RANGE = "'ALL CARDS'!A:P"

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"]
          )
          for attempt in range(3):
              try:
                  credentials.refresh(Request())
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(5 * (attempt + 1))

          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          session = requests.Session()
          session.mount("https://", HTTPAdapter(max_retries=Retry(total=3, backoff_factor=2, status_forcelist=[429, 500, 502, 503, 504])))
          response = session.get(
              f"https://sheets.googleapis.com/v4/spreadsheets/{SHEET_ID}/values/{RANGE}",
              headers={"Authorization": f"Bearer {credentials.token}"},
              timeout=30
          )
          response.raise_for_status()
          rows = response.json().get("values", [])

          if len(rows) < 2:
              raise RuntimeError("Sheet is empty; database unchanged.")

          headers = [str(h).strip() for h in rows[0]]
          required = {"Card ID", "Market Value ₹", "Estimated Value ₹"}
          if not required.issubset(headers):
              raise RuntimeError("Required columns missing; database unchanged.")

          sheet_cards = {}
          for row in rows[1:]:
              record = dict(zip(headers, row))
              card_id = str(record.get("Card ID", "")).strip()
              if card_id:
                  if card_id in sheet_cards:
                      raise RuntimeError(f"Duplicate Card ID: {card_id}")
                  sheet_cards[card_id] = record

          def parse_price(value):
              try:
                  price = float(str(value).replace("₹", "").replace(",", "").strip())
                  return round(price, 2) if math.isfinite(price) and price > 0 else None
              except (TypeError, ValueError):
                  return None

          path = pathlib.Path("cards.json")
          cards = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(cards, list):
              raise RuntimeError("Unexpected cards.json format.")

          changed = 0
          checked_on = datetime.now(timezone(timedelta(hours=5, minutes=30))).date().isoformat()

          for card in cards:
              record = sheet_cards.get(str(card.get("id", "")).strip())
              if not record:
                  continue

              # Prefer market-guide estimate, fall back to collector estimate.
              price = (
                  parse_price(record.get("Market Value ₹"))
                  or parse_price(record.get("Estimated Value ₹"))
              )
              if price is None:
                  continue

              card["valueDataChecked"] = checked_on

              before = (
                  card.get("marketValue"),
                  card.get("valuationStatus"),
                  card.get("tradeEligible"),
                  card.get("confidence"),
              )

              card["marketValue"] = price
              card["valuationStatus"] = "estimate"
              card["tradeEligible"] = False
              card["confidence"] = "Estimate"

              after = (
                  card["marketValue"],
                  card["valuationStatus"],
                  card["tradeEligible"],
                  card["confidence"],
              )

              if before != after:
                  changed += 1

          if changed or any(card.get("valueDataChecked") == checked_on for card in cards):
              path.write_text(
                  json.dumps(cards, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

          checked_count = sum(card.get("valueDataChecked") == checked_on for card in cards)
          if checked_count < 500:
              raise RuntimeError(f"Health check failed: only {checked_count} cards received today\'s check date (expected at least 500).")
          print(f"Health check passed: {checked_count} cards checked on {checked_on}")
          print(f"Sheet cards: {len(sheet_cards)}")
          print(f"Database cards: {len(cards)}")
          print(f"Cards updated: {changed}")
          print("Prices are estimates, not verified sales.")
          PY

      - name: Commit updated estimates
        run: |
          if git diff --quiet -- cards.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json
          git commit -m "Sync estimated Match Attax prices"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done

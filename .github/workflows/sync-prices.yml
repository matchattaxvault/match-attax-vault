
name: Sync Match Attax Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Check Google Sheet pricing evidence
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          from collections import defaultdict
          from datetime import datetime
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          SHEET_ID = "1nDSwSESkuvCb2FUYPdMovynhv5n9tWxN8GkfghuBm_g"

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"]
          )
          credentials.refresh(Request())

          def read_sheet(tab):
              response = requests.get(
                  f"https://sheets.googleapis.com/v4/spreadsheets/{SHEET_ID}/values/{requests.utils.quote(tab, safe='')}",
                  headers={"Authorization": f"Bearer {credentials.token}"},
                  timeout=30
              )
              response.raise_for_status()
              rows = response.json().get("values", [])
              if not rows:
                  raise RuntimeError(f"Missing or empty tab: {tab}")
              headers = [str(h).strip() for h in rows[0]]
              return [
                  dict(zip(headers, row))
                  for row in rows[1:]
                  if any(str(value).strip() for value in row)
              ]

          cards_sheet = read_sheet("'ALL CARDS'!A:P")
          sales_sheet = read_sheet("'SOLD SALES EVIDENCE'!A:I")

          cards_path = pathlib.Path("cards.json")
          cards = json.loads(cards_path.read_text(encoding="utf-8"))

          if not isinstance(cards, list):
              raise RuntimeError("Unexpected cards.json format")

          sales_by_id = defaultdict(list)

          for sale in sales_sheet:
              card_id = sale.get("Card ID", "").strip()
              evidence = sale.get("Evidence", "").strip().lower()
              url = sale.get("URL", "").strip()
              amount = sale.get("Sold USD", "").strip()

              try:
                  value = float(amount)
              except ValueError:
                  continue

              if (
                  card_id
                  and evidence == "reported completed sale"
                  and url.startswith("https://")
                  and value > 0
              ):
                  sales_by_id[card_id].append(sale)

          matched = 0
          pending = 0

          for card in cards:
              card_id = str(card.get("id", "")).strip()
              sales = sales_by_id.get(card_id, [])

              if sales:
                  matched += 1
                  print(
                      f"{card_id}: {len(sales)} reported sales; "
                      "price not automatically changed"
                  )
                  pending += 1

          print(f"Cards in database: {len(cards)}")
          print(f"Rows in ALL CARDS: {len(cards_sheet)}")
          print(f"Rows in SOLD SALES EVIDENCE: {len(sales_sheet)}")
          print(f"Cards with matching reported sales: {matched}")
          print(f"Cards awaiting stronger verification: {pending}")
          print("Verified price changes: 0")
          print("No existing prices, estimates, or Vault AI modified.")
          PY
